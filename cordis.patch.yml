# 在插件页设置接口地址并将 API Key 保存到 Harness 凭据库。
# 可在 profile 的 cordis.patch.yml 中按 id 覆盖配置。各项说明见 README.md。
- insert:
    - id: fofatoto
      name: 'dsh-fofatoto'
      config:
        baseUrl: https://fofa.info
        credentialRef: FOFA_API_KEY
        apiKeyEnv: FOFA_KEY
        timeoutMs: 45000
        retries: 2
        defaultFields: host,ip,port,protocol,domain,title
        outputDir: ''
        maxExportRows: 50000
        maxExportSeconds: 240
        rateLimitSeconds: 5
        fofatotoConfigPath: ''
